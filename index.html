  function isBlocked(x,y){
    const gx=Math.floor(x/T),gy=Math.floor(y/T);const cell=terrain(gx,gy);
    if(cell==='water')return true;

  function update(dt){
    elapsed+=dt;tick+=dt;
    if(fishing){fishing.timer+=dt;fishing.position=.5+.47*Math.sin(fishing.timer*5.1);}
    if(!modal&&!fishing){
      let dx=0,dy=0;
      if(keys.has('ArrowLeft')||keys.has('KeyA')||virt.has('left'))dx--;
      if(keys.has('ArrowRight')||keys.has('KeyD')||virt.has('right'))dx++;
      if(keys.has('ArrowUp')||keys.has('KeyW')||virt.has('up'))dy--;
      if(keys.has('ArrowDown')||keys.has('KeyS')||virt.has('down'))dy++;
      const len=Math.hypot(dx,dy);if(len){dx/=len;dy/=len;
        const spd=105*dt;
        if(!isBlocked(player.x+dx*spd,player.y))player.x+=dx*spd;
        if(!isBlocked(player.x,player.y+dy*spd))player.y+=dy*spd;
        if(dx)player.dir=dx>0?1:-1;
        player.step+=dt*9;
      }
      s.clock=Math.min(23*60+30,s.clock+dt*1.6);
    }
    cam.x=lerp(cam.x,clamp(player.x-W/2,0,MW*T-W),Math.min(1,dt*8));
    cam.y=lerp(cam.y,clamp(player.y-H/2,0,MH*T-H),Math.min(1,dt*8));

  function tileDraw(x,y,xx,yy,ms){

    }
    const pal=tile==='path'||tile==='plaza'?['#dfc399','#dfc39b','#e0c49d']:
      tile==='garden'?['#9acb82','#94c77e','#a2cd88']:
      tile==='sand'?['#efdaae','#e9d6a8','#e9d2a4']:

      c.fillStyle='rgba(254,236,191,.45)';c.beginPath();c.ellipse(xx+17,yy+18,5,2,0,0,Math.PI*2);c.fill();

function beep(freq=540,duration=.08,type='sine',volume=.035){
  if(!settings.sound)return;
  try{
    audioContext ||= new (window.AudioContext||window.webkitAudioContext)();
    if(audioContext.state==='suspended')audioContext.resume();
    const osc=audioContext.createOscillator(),g=audioContext.createGain(),t=audioContext.currentTime;
    osc.type=type;osc.frequency.setValueAtTime(freq,t);
    g.gain.setValueAtTime(volume,t);g.gain.exponentialRampToValueAtTime(.0001,t+duration);
    osc.connect(g);g.connect(audioContext.destination);osc.start(t);osc.stop(t+duration+.008);
  }catch{/* sound is optional */}
}

function settingsHTML(){return `<div class="settings-page"><div class="page-head"><div><span class="eyebrow">PERSONALIZE YOUR CONSOLE</span><h1>게임기 설정</h1><p>나만의 게임기 환경을 바꿔 보세요.</p></div><span class="page-symbol">⚙️</span></div>
<div class="setting-box"><div><strong>🔊 게임 사운드</strong><small>픽셀 효과음 재생</small></div><button class="toggle-switch ${settings.sound?'enabled':''}" data-setting="sound" aria-label="사운드 설정">${settings.sound?'켜짐':'꺼짐'}</button></div>
<div class="setting-box"><div><strong>🪪 플레이어 이름</strong><small>온라인 TOP 10 진입 시 입력창에 미리 표시될 이름</small></div><div class="rename-wrap"><input id="playerName" maxlength="12" value="${ESC(settings.playerName)}"><button class="pixel-button" data-setting="name">저장</button></div></div>
<div class="setting-box"><div><strong>🌿 똥물의 숲 저장 데이터</strong><small>${loadGame('forest')?'진행 상황이 이 브라우저에 저장되어 있습니다.':'아직 저장된 진행 상황이 없습니다.'}</small></div><button class="pixel-button danger" data-setting="resetForest">초기화</button></div>
<div class="system-note"><strong>📦 프로젝트 정보</strong><p>귤텐도스위치 v3.0 · Vite + Vanilla JavaScript · Canvas 카툰 그래픽</p><p>🏆 랭킹은 Firebase에서 공유됩니다. 똥물의 숲의 진행 데이터는 브라우저에 별도로 저장됩니다.</p></div></div>`;}
function updateNav(){document.querySelectorAll('.dock-button').forEach(b=>b.classList.toggle('active',b.dataset.view===(view==='play'?'games':view)));}
function teardownGame(){scoreCheckSequence++;pendingCandidate=null;if(activeGame){activeGame.destroy();activeGame=null;activeId=null;}}
function setView(next){
  ++rankRequest;scoreCheckSequence++;pendingCandidate=null;
  if(view==='play')teardownGame();view=next;consoleShell.classList.remove('is-playing');dialog.classList.add('hidden');
  content.classList.toggle('playing',next==='play');
  content.innerHTML=next==='home'?homeHTML():next==='games'?gamesHTML():next==='ranks'?ranksHTML():settingsHTML();
  updateNav();if(next==='ranks')syncCloudRanks();beep(610,.055);
}
async function syncCloudRanks(){
  const current=++rankRequest,id=rankingId;
  const rows=document.getElementById('rankRows'),scope=document.getElementById('rankingScope');
  if(!rows||!scope)return;
  rows.innerHTML='<div class="rank-loading">⏳ Firebase에서 상위 10개 기록을 불러오는 중...</div>';
  scope.textContent='🌐 조회 중';
  try{
    const data=await fetchCloudRankings(id);
    if(current!==rankRequest||view!=='ranks'||id!==rankingId)return;
    document.getElementById('rankRows').innerHTML=rankRows(data);
    document.getElementById('rankingScope').textContent='🌐 온라인 TOP 10';
  }catch(error){
    if(current!==rankRequest||view!=='ranks')return;
    document.getElementById('rankingScope').textContent='⚠️ 온라인 연결 실패';
    document.getElementById('rankRows').innerHTML=`<div class="rank-loading">⚠️ 순위를 불러오지 못했어요.<br>Firebase 익명 로그인과 Firestore 규칙을 확인해 주세요.<br><small>${ESC(error.message)}</small></div>`;
  }
}
function startGame(id){
  const meta=getGame(id);if(!meta)return;
  if(activeGame)teardownGame();view='play';activeId=id;consoleShell.classList.add('is-playing');
  content.classList.add('playing');
  content.innerHTML=`<div class="gameplay-page"><div class="gameplay-head"><button class="back-link" data-view="games">‹ 라이브러리</button><div><b>${meta.icon} ${meta.name}</b><small>${meta.genre}</small></div><div class="gameplay-head-right"><button data-game-command="save-score">🏆 TOP 10 도전</button><button data-view="ranks">랭킹 ›</button></div></div><div class="game-stage"><canvas id="gameCanvas" width="640" height="360" aria-label="${meta.name} 실제 게임 화면"></canvas><div id="gameOverlay" class="game-overlay hidden"></div></div><div id="gameDock" class="game-dock"></div><div class="gamehelp-row"><span>🎮 ${id==='meteor'?'플레이: SPACE 방향 전환 · 종료: ENTER 랭킹 확인':meta.controls}</span><span>ESC 또는 B: 뒤로</span></div></div>`;
  updateNav();
  const canvas=document.getElementById('gameCanvas');
  activeGame=meta.create(canvas,{
    overlay:document.getElementById('gameOverlay'),dock:document.getElementById('gameDock'),
    toast:showToast,beep,goBack:()=>setView('games'),submitScore:(n,stillValid)=>checkScoreForTop10(id,n,stillValid)
  });
  canvas.addEventListener('pointerdown',()=>{activeGame?.onPointer?.();});
  beep(800,.12,'triangle');
}
async function checkScoreForTop10(id,rawScore,stillValid=()=>true){
  if(view!=='play'||activeId!==id)return;
  const n=Math.floor(Number(rawScore));
  if(!Number.isFinite(n)||n<1){showToast('기록이 1점 이상일 때 도전할 수 있어요.');return;}
  const seq=++scoreCheckSequence;
  pendingCandidate=null;
  showToast('🌐 온라인 TOP 10 진입 여부 확인 중...');
  try{
    const rank=await checkCloudQualification(id,n);
    if(seq!==scoreCheckSequence||view!=='play'||activeId!==id||!stillValid())return;
    if(!rank.qualified){
      showToast(`🏆 TOP 10 밖이에요. 현재 10위 ${rank.cutoff.toLocaleString()}점, 내 기록 ${n.toLocaleString()}점`);
      return;
    }
    pendingCandidate={id,score:n};
    const game=getGame(id);
    dialog.innerHTML=`<div class="score-dialog"><p class="eyebrow">🎉 ONLINE TOP 10</p><h2>🏆 ${rank.position}위 진입!</h2><p><strong>${ESC(game.name)}</strong> · <span class="highlight-score">${n.toLocaleString()}점</span></p><p>TOP 10에 들어왔어요! 랭킹에 표시할 닉네임을 입력해 주세요.</p><label for="rankName">닉네임 (최대 12자)</label><input id="rankName" maxlength="12" value="${ESC(settings.playerName)}" autocomplete="off"><div class="modal-buttons"><button class="pixel-button orange" data-score-submit="${id}">🌐 온라인 등록 (ENTER)</button><button class="pixel-button" data-dialog-close>취소</button></div><small>닉네임 작성 후 ENTER 또는 등록 버튼 클릭. SPACE는 게임 재시작에 사용되지 않습니다.</small></div>`;
    dialog.classList.remove('hidden');
    setTimeout(()=>document.getElementById('rankName')?.focus(),30);
    beep(950,.13,'triangle');
  }catch(error){
    if(seq===scoreCheckSequence&&view==='play'&&activeId===id){
      showToast(`⚠️ 온라인 TOP 10 조회 실패: ${error.message}`);
    }
  }
}
async function submitRank(id){
  const candidate=pendingCandidate;
  if(scoreSaveBusy||!candidate||candidate.id!==id)return;
  const input=document.getElementById('rankName'),name=(input?.value||'').trim().slice(0,12);
  if(!name){showToast('닉네임을 입력해 주세요.');input?.focus();return;}
  scoreSaveBusy=true;
  const button=document.querySelector('[data-score-submit]');
  if(button){button.disabled=true;button.textContent='⏳ 등록 중...';}
  try{
    const result=await submitCloudScore(id,name,candidate.score);
    settings.playerName=name;setSettings(settings);
    if(result.position)submitLocalScore(id,name,candidate.score);
    pendingCandidate=null;dialog.classList.add('hidden');
    if(result.position){showToast(`🏆 온라인 ${result.position}위 등록 성공!`);beep(1000,.15,'triangle');}
    else showToast(result.submitted?'경쟁 중 순위가 밀려 TOP 10 밖으로 나갔어요.':'등록 중 다른 기록에 밀려 TOP 10 밖으로 나갔어요.');
  }catch(error){showToast(`⚠️ 온라인 등록 실패: ${error.message}`);}
  finally{
    scoreSaveBusy=false;
    if(button?.isConnected){button.disabled=false;button.textContent='🌐 온라인 등록';}
  }
}
function physicalButton(name){
  if(name==='back'){if(!dialog.classList.contains('hidden'))dialog.classList.add('hidden');else if(view==='play')setView('games');else setView('games');return;}
  if(name==='action'){
    if(view==='play'){activeGame?.onKey?.({code:activeId==='meteor'?'Space':'KeyE',type:'keydown',repeat:false,preventDefault(){}});}
    else if(view==='home'||view==='games')startGame(GAME_REGISTRY[0].id);
  }
}
app.addEventListener('click',e=>{
  const nav=e.target.closest('[data-view]');if(nav){setView(nav.dataset.view);return;}
  const game=e.target.closest('[data-launch]');if(game){startGame(game.dataset.launch);return;}
  const rank=e.target.closest('[data-rank-game]');if(rank){rankingId=rank.dataset.rankGame;content.innerHTML=ranksHTML();syncCloudRanks();beep(630,.04);return;}
  if(e.target.closest('[data-rank-refresh]')){syncCloudRanks();return;}
  const command=e.target.closest('[data-game-command]');if(command){activeGame?.onCommand?.(command.dataset.gameCommand);return;}
  const submit=e.target.closest('[data-score-submit]');if(submit){submitRank(submit.dataset.scoreSubmit);return;}
  if(e.target.closest('[data-dialog-close]')){pendingCandidate=null;scoreCheckSequence++;dialog.classList.add('hidden');return;}
  const sbtn=e.target.closest('[data-setting]');if(sbtn){
    if(sbtn.dataset.setting==='sound'){settings.sound=!settings.sound;setSettings(settings);content.innerHTML=settingsHTML();showToast(settings.sound?'🔊 소리를 켰어요':'🔇 소리를 껐어요');beep(630,.08);}
    else if(sbtn.dataset.setting==='name'){const n=document.getElementById('playerName').value.trim();if(!n){showToast('닉네임을 입력해 주세요.');return;}settings.playerName=n.slice(0,12);setSettings(settings);showToast('🪪 닉네임이 저장됐어요!');}
    else if(sbtn.dataset.setting==='resetForest'&&confirm('똥물의 숲의 진행 상황을 전부 삭제할까요? (랭킹은 유지됩니다)')){deleteSave('forest');content.innerHTML=settingsHTML();showToast('섬 저장 데이터를 초기화했어요.');}
    return;
  }
  const face=e.target.closest('[data-console]');if(face){physicalButton(face.dataset.console);return;}
});
function sendKey(code,type){activeGame?.onKey?.({code,type,repeat:false,preventDefault(){}});}
const PAD={up:'ArrowUp',down:'ArrowDown',left:'ArrowLeft',right:'ArrowRight'};
app.addEventListener('pointerdown',e=>{const b=e.target.closest('[data-pad]');if(b&&view==='play'){b.setPointerCapture?.(e.pointerId);sendKey(PAD[b.dataset.pad],'keydown');}});
app.addEventListener('pointerup',e=>{const b=e.target.closest('[data-pad]');if(b&&view==='play')sendKey(PAD[b.dataset.pad],'keyup');});
app.addEventListener('pointercancel',e=>{const b=e.target.closest('[data-pad]');if(b&&view==='play')sendKey(PAD[b.dataset.pad],'keyup');});
window.addEventListener('keydown',e=>{
  const typing=e.target.matches('input,textarea,select');
  // Never let SPACE activate a focused restart button after game over.
  // Allow ordinary spaces inside the nickname input, however.
  if(view==='play'&&activeId==='meteor'&&e.code==='Space'&&!typing)e.preventDefault();
  if(typing){
    if(e.code==='Enter'&&e.target.id==='rankName'){
      e.preventDefault();
      if(!e.repeat)dialog.querySelector('[data-score-submit]')?.click();
    }
    return;
  }
  if(!dialog.classList.contains('hidden')){
    if(e.code==='Escape'){pendingCandidate=null;scoreCheckSequence++;dialog.classList.add('hidden');return;}
    if(e.code==='Enter'&&!e.repeat&&!e.target.matches('button')){
      e.preventDefault();dialog.querySelector('[data-score-submit]')?.click();
    }
    return; // An open nickname dialog has exclusive keyboard focus.
  }
  if(view==='play'){
    if(e.code==='Escape'&&activeId==='meteor'){setView('games');return;}
    // Let native ENTER-to-click work on game buttons without double-handling.
    if(e.code==='Enter'&&e.target.matches('button'))return;
    activeGame?.onKey?.(e);
  }else if(e.code==='Escape'&&view!=='games')setView('games');
});
window.addEventListener('keyup',e=>{
  if(view==='play'&&dialog.classList.contains('hidden')&&!e.target.matches('input,textarea,select'))activeGame?.onKey?.(e);
});
setView('games');
</script></body></html>
